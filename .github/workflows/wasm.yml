name: Build cool-retro-term (wasm) and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Install Qt 6 for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.3
          target: wasm
          arch: wasm_singlethread
          arch: wasm_singlethread
          host: linux

      - name: Build
        run: |
          source $HOME/emsdk/emsdk_env.sh
          cd "$GITHUB_WORKSPACE"
          ./scripts/build-wasm.sh

      - name: Stage site
        run: |
          mkdir -p site
          cp build-wasm/deploy/cool-retro-term.js build-wasm/deploy/cool-retro-term.wasm site/ 2>/dev/null || true
          cp wasm/index.html site/
          cp -r app/qml/fonts site/fonts 2>/dev/null || true
          cp -r app/qml/images site/images 2>/dev/null || true
          cp -r app/icons site/icons 2>/dev/null || true
          cat > site/.nojekyll <<X
          X

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
