<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cool-retro-term (wasm)</title>
<style>
  body { margin:0; background:#050505; }
  #crt { width:100vw; height:100vh; }
  #log { position:fixed; left:8px; bottom:8px; width:80%; height:14px;
         color:#5f5; font:12px monospace; opacity:.85; z-index:9999; }
</style>
</head>
<body>
  <canvas id="crt" tabindex="0"></canvas>
  <div id="log">[crt] loading page...</div>
  <script>
  const log = document.getElementById('log');
  window.addEventListener('error', e => {
    log.textContent = '[crt] error: ' + (e.message || e.type).slice(0, 250);
  });
  try {
    const gl = document.createElement('canvas').getContext('webgl2') || document.createElement('canvas').getContext('webgl');
    if (!gl) log.textContent = '[crt] WebGL unavailable — Qt wasm cannot render';
  } catch (e) { log.textContent = '[crt] WebGL probe failed: ' + e; }
  </script>

  <!-- Emscripten output of cool-retro-term built with Qt for WebAssembly -->
  <script src="cool-retro-term.js"></script>
  <script src="boot-sim.js"></script>

  <script>
  // ---- Pipe API ----------------------------------------------------------
  // Host contract: the page feeds text into the terminal and receives
  // the terminal's raw byte stream (VT sequences included, unmodified).
  //
  //   window.crt.write(string)            -> pipe in
  //   window.crt.onRead(cb(Uint8Array))   -> pipe out
  //   window.crt.writable(bytes)          -> mirror pipe-in from raw bytes
  const readSubscribers = [];
  let module = null;

  window.crtTermReadOut = function (bytes) {
    for (const cb of readSubscribers) cb(bytes);
  };

  window.crt = {
    write (text) {
      if (!module) return;
      const b = new TextEncoder().encode(text);
      const p = module._malloc(b.length || 1);
      module.HEAPU8.set(b, p);
      module._crt_wasm_in(p, b.length);
      module._free(p);
    },
    onRead (cb) { readSubscribers.push(cb); }
  };

  // Minimal demo sink: show raw bytes in the corner strip until the
  // host wires a real consumer.
  window.crt.onRead(b => {
    const s = new TextDecoder('utf-8', { fatal: false }).decode(b);
    log.textContent = (log.textContent + s).slice(-400);
  });

  function boot () {
    if (typeof createQtAppInstance === 'undefined') { setTimeout(boot, 100); return; }
    // Prefetch the wasm ourselves so we can show progress and rule out
    // silent fetch/compile hangs inside the emscripten glue.
    log.textContent = '[crt] downloading wasm (0%)...';
    fetch('cool-retro-term.wasm').then(r => {
      if (!r.ok) throw new Error('wasm HTTP ' + r.status);
      const total = +r.headers.get('Content-Length') || 0;
      const reader = r.body.getReader();
      const chunks = [];
      let got = 0;
      const tick = setInterval(() => {
        if (total) log.textContent = '[crt] downloading wasm (' + Math.round(got / total * 100) + '%)...';
      }, 500);
      const pump = () => reader.read().then(({ done, value }) => {
        if (done) { clearInterval(tick); return compile(chunks); }
        chunks.push(value); got += value.length; return pump();
      });
      return pump();
    }, e => { log.textContent = '[crt] fetch failed: ' + e; }).catch(e => { log.textContent = '[crt] fetch failed: ' + e; });

    function compile (chunks) {
      const bytes = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0));
      let off = 0; for (const c of chunks) { bytes.set(c, off); off += c.length; }
      log.textContent = '[crt] compiling wasm (' + Math.round(bytes.length / 1048576) + ' MB)...';
      window.__wasmBytes = bytes;
      boot2();
    }

    function boot2 () {
      const canvas = document.getElementById('crt');
      log.textContent = '[crt] instantiating wasm...';
      createQtAppInstance({
      canvas: canvas,
      qtContainerElements: [canvas],
      wasmBinary: window.__wasmBytes,
      locateFile: f => f,
      print: t => { if (t) log.textContent = ('[crt] ' + t).slice(0, 300); console.log('[crt]', t); },
      printErr: t => { if (t) { console.error('[crt]', t); if (/abort|fail|error|cannot|unable/i.test(t)) log.textContent = ('[crt] ' + t).slice(0, 300); } },
    }).then(m => {
      module = m;
      log.textContent = '[crt] app up — boot simulation starting';
      setTimeout(window.startBootSim, 1500);
    }, e => { log.textContent = '[crt] init failed: ' + e; console.error(e); });
    }
  }
  boot();
  </script>
</body>
</html>
